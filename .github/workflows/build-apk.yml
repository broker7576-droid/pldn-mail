# PLDN Mail | build-apk.yml | VERSION: mail-build-v2 | LINES: 90
name: Build PLDN Mail APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Add google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json added"
          else
            echo "WARNING: google-services.json not found, push will not work"
          fi

      - name: Fix Gradle version bug
        run: |
          sed -i -E 's#gradle-[0-9.]+-all\.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Apply version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Fixed debug signing
        run: |
          if [ -f debug.keystore ]; then
            cp debug.keystore android/app/debug.keystore
            echo 'android.signingConfigs.debug.storeFile = file("debug.keystore")' >> android/app/build.gradle
            echo 'android.signingConfigs.debug.storePassword = "android"' >> android/app/build.gradle
            echo 'android.signingConfigs.debug.keyAlias = "androiddebugkey"' >> android/app/build.gradle
            echo 'android.signingConfigs.debug.keyPassword = "android"' >> android/app/build.gradle
          else
            echo "WARNING: debug.keystore not found, APK signature changes every build"
          fi

      - name: Add notification permission
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pldn-mail.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PLDN Mail ${{ github.run_number }}
          files: pldn-mail.apk
          make_latest: true
